name: Push Images to Aliyun ACR

on:
  push:
    paths:
      - 'images_mini.txt'
  workflow_dispatch:

jobs:
  push-to-acr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: false # 这里设为false，因为我们要拉取新镜像

      # 1. 登录阿里云镜像仓库
      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: registry.cn-beijing.aliyuncs.com # 根据你的地域修改，如 cn-shanghai
          access-key-id: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          region-id: cn-beijing  # <--- 必须和上面一致

      - name: Pull, Tag, and Push
        run: |
          # 配置变量
          REGISTRY=registry.cn-beijing.aliyuncs.com
          NAMESPACE=github_action1
          
          echo "Starting process..."
          
          # 提取 251 到 300 行
          sed -n '1,56p' images_mini.txt | while IFS= read -r image || [ -n "$image" ]; do
            [[ -z "$image" || "$image" =~ ^# ]] && continue
            image=$(echo "$image" | xargs)
            
            echo "--------------------------------"
            echo "Processing image: $image"

            # 1. 拉取原始镜像
            if docker pull "$image"; then
              
              # 2. 生成阿里云镜像标签
              # 将原始镜像名中的 / 替换为 - ，防止多级路径冲突
              # 例如：bitnami/redis:latest -> registry.../namespace/bitnami-redis:latest
              RAW_NAME=$(echo "$image" | cut -d'/' -f2-)
              # 如果镜像名不含斜杠(如 mysql:8.0)，上一行会处理错，改用下面更稳妥的方法：
              IMAGE_TAG=$(echo "$image" | sed 's/.*\///') # 只取冒号前后的名字
              
              # 建议直接用简单的逻辑：将整个原始路径中的 / 换成 -
              SAFE_NAME=$(echo "$image" | sed 's/[\/]/--/g')
              NEW_IMAGE="$REGISTRY/$NAMESPACE/$SAFE_NAME"
              
              echo "Re-tagging $image to $NEW_IMAGE"
              docker tag "$image" "$NEW_IMAGE"
              
              # 3. 推送至阿里云
              echo "Pushing $NEW_IMAGE..."
              docker push "$NEW_IMAGE"
              
              # 4. 清理本地空间
              docker rmi "$image" "$NEW_IMAGE"
              echo "Done and cleaned."
            else
              echo "Failed to pull $image, skipping..."
            fi
          done

      - name: Check Final Space
        run: df -h
