name: Bulk Download from File

on:
  push:
    paths:
      - 'images_300.txt'  # 只要你修改这个文件并推送，就自动运行
  workflow_dispatch:   # 也保留手动触发按钮

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # 以下选项可根据需要开启/关闭
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check disk space
        run: df -h
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pull and Save
        run: |
          mkdir -p ./docker_images
          # --- 增加调试信息 ---
          echo "Current directory: $(pwd)"
          echo "Files in directory:"
          ls -F
          echo "Total lines in images_300.txt: $(wc -l < images_300.txt)"
          # ------------------
          # 1. 使用 sed 提取 100 到 200 行
          # 2. 循环处理
          sed -n '101,150p' images_300.txt | while IFS= read -r image || [ -n "$image" ]; do
          # 过滤空行和注释
            [[ -z "$image" || "$image" =~ ^# ]] && continue
            image=$(echo "$image" | xargs)
            
            echo "Processing $image..."

            # 拉取镜像
            if docker pull "$image"; then
              CLEAN_NAME=$(echo "$image" | sed 's/[\/:]/_/g')
              
              # 保存并直接通过 gzip 压缩 (大幅节省空间)
              echo "Saving and compressing $image..."
              docker save "$image" | gzip > "./docker_images/${CLEAN_NAME}.tar.gz"
              
              # 关键步骤：删除已下载的镜像以释放空间，为下一个镜像腾地方
              docker rmi "$image"
            else
              echo "Failed to pull $image, skipping..."
            fi
          done
              
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-images
          path: ./docker_images/
